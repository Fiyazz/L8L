:root {
  --paper: #F5F4FB;
  --sheet: #FFFFFF;
  --ink: #1D1A4A;
  --ink-soft: #4B4878;
  --fuchsia: #D41E76;
  --on-fuchsia: #FFFFFF;
  --hard: #1D1A4A;
  --tape: rgba(245, 181, 63, 0.62);
  --dot: rgba(43, 47, 160, 0.11);
  --logo-l: #2B2FA0;
  --font-body: "Bricolage Grotesque", ui-rounded, "Trebuchet MS", system-ui, sans-serif;
  --blob: 58% 42% 55% 45% / 45% 55% 45% 55%;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #15133A;
    --sheet: #221F55;
    --ink: #F2F0FF;
    --ink-soft: #B9B6E3;
    --fuchsia: #FF4FA0;
    --on-fuchsia: #210A1A;
    --hard: #07061A;
    --tape: rgba(255, 198, 92, 0.45);
    --dot: rgba(255, 255, 255, 0.06);
    --logo-l: #FFFFFF;
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  padding: calc(env(safe-area-inset-top, 0px) + 1.5rem) 1.25rem calc(env(safe-area-inset-bottom, 0px) + 3rem);
  background-color: var(--paper);
  background-image: radial-gradient(var(--dot) 1.2px, transparent 1.5px);
  background-size: 26px 26px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1.125rem;
  line-height: 1.55;
}
a { color: inherit; }
:focus-visible { outline: 3px dashed var(--fuchsia); outline-offset: 4px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
main { width: 100%; max-width: 34rem; margin-inline: auto; display: grid; gap: 2.25rem; }
.logo { display: inline-flex; justify-self: start; padding: .4rem 0; }
.l8l { display: block; height: 2.2rem; width: auto; }
.l8l .l8l-l { fill: var(--logo-l); }
.l8l .l8l-8 { fill: var(--fuchsia); }
.card {
  position: relative;
  display: grid;
  gap: 1.1rem;
  min-width: 0;
  padding: 1.9rem 1.5rem 1.5rem;
  background: var(--sheet);
  border: 2.5px solid var(--hard);
  box-shadow: 7px 8px 0 var(--hard);
  transform: rotate(-.6deg);
}
.card::before {
  content: "";
  position: absolute;
  top: -11px;
  left: 2rem;
  width: 80px;
  height: 22px;
  background: var(--tape);
  transform: rotate(-4deg);
}
h1 {
  margin: 0;
  font-size: clamp(1.8rem, 7vw, 2.3rem);
  line-height: 1.05;
  letter-spacing: -0.03em;
  font-weight: 800;
  text-wrap: balance;
}
p { margin: 0; }
.actions, .row { display: flex; flex-wrap: wrap; gap: .8rem; }
.row { gap: .2rem .9rem; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: .85rem 1.45rem;
  font: inherit;
  font-size: 1.05rem;
  font-weight: 700;
  line-height: 1.2;
  text-decoration: none;
  border: 2.5px solid var(--ink);
  border-radius: var(--blob);
  box-shadow: 4px 5px 0 var(--hard);
  cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease;
}
.btn:hover { transform: translate(-1px, -2px) rotate(-1deg); box-shadow: 6px 7px 0 var(--hard); }
.btn:active { transform: translate(3px, 4px); box-shadow: 1px 1px 0 var(--hard); }
.btn-primary { background: var(--fuchsia); color: var(--on-fuchsia); }
.btn-ghost { background: var(--sheet); color: var(--ink); }
.link-btn {
  display: inline-flex;
  align-items: center;
  min-height: 2.75rem;
  padding: .3rem .2rem;
  font: inherit;
  font-weight: 700;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
  text-decoration: underline wavy var(--fuchsia) 2px;
  text-underline-offset: 6px;
}
textarea {
  display: block;
  width: 100%;
  min-height: 11.5rem;
  margin: 0;
  padding: .8rem .9rem;
  font: inherit;
  font-size: 1rem;
  line-height: 1.5;
  color: var(--ink);
  background: var(--paper);
  border: 2px dashed var(--ink);
  border-radius: 10px 6px 12px 8px;
  resize: vertical;
}
.alt { color: var(--ink-soft); font-size: 1rem; }
.addr { color: var(--ink); font-weight: 800; overflow-wrap: anywhere; -webkit-user-select: all; user-select: all; }
.status { min-height: 1.5em; font-size: 1rem; font-weight: 600; }
.back { justify-self: start; font-weight: 700; text-decoration: underline wavy var(--fuchsia) 2px; text-underline-offset: 6px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .001ms !important; }
}
</style>
